name: Build SK Pizza Point Admin URL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Restore Firebase Android config
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > android-admin/app/google-services.json
          elif [ ! -s "android-admin/app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"336176195310","firebase_url":"https://sk-pizza-point-default-rtdb.asia-southeast1.firebasedatabase.app","project_id":"sk-pizza-point","storage_bucket":"sk-pizza-point.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:336176195310:android:34a9b6c123ef890a","android_client_info":{"package_name":"com.skpizzapoint.admin"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD-PlaceholderKey"}]}]}' > android-admin/app/google-services.json
          fi

      - name: Sync Website Brand Logo into APK Icon
        run: |
          python3 -c "
          import urllib.request, os
          from PIL import Image

          url = 'https://i.imgur.com/KRI3jtw.jpeg'
          os.makedirs('tmp_logo', exist_ok=True)
          urllib.request.urlretrieve(url, 'tmp_logo/brand_logo.jpg')
          img = Image.open('tmp_logo/brand_logo.jpg').convert('RGBA')

          densities = [
              ('mipmap-mdpi', 48),
              ('mipmap-hdpi', 72),
              ('mipmap-xhdpi', 96),
              ('mipmap-xxhdpi', 144),
              ('mipmap-xxxhdpi', 192)
          ]
          res_dir = 'android-admin/app/src/main/res'
          for folder, size in densities:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
          "

      - name: Build APK
        working-directory: android-admin

        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android-admin/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-admin/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sk-pizza-point-admin-url-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
