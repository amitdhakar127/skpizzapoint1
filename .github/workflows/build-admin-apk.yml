name: Build SK Pizza Point Admin URL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Restore Firebase Android config
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > android-admin/app/google-services.json
          elif [ ! -s "android-admin/app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"336176195310","firebase_url":"https://sk-pizza-point-default-rtdb.asia-southeast1.firebasedatabase.app","project_id":"sk-pizza-point","storage_bucket":"sk-pizza-point.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:336176195310:android:34a9b6c123ef890a","android_client_info":{"package_name":"com.skpizzapoint.admin"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCCYR2QyIICr9wbS-P5X1m9860TSmmnHco"}]}]}' > android-admin/app/google-services.json
          fi

      - name: Setup Python for Brand Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Icon Dependencies
        run: |
          pip install --no-cache-dir pillow requests

      - name: Generate High-Resolution Android Brand Icons
        run: |
          python3 android-admin/generate_icons.py

      - name: Verify All Brand Icons Generated
        run: |
          echo "Verifying launcher icons across all densities..."
          test -f android-admin/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android-admin/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android-admin/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android-admin/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android-admin/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Verifying round launcher icons..."
          test -f android-admin/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          echo "Verifying adaptive foreground icons..."
          test -f android-admin/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          test -f android-admin/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          test -f android-admin/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          test -f android-admin/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          test -f android-admin/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          ls -la android-admin/app/src/main/res/mipmap-xxxhdpi/
          echo "All brand icons verified successfully!"

      - name: Build APK
        working-directory: android-admin

        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android-admin/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-admin/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sk-pizza-point-admin-url-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
