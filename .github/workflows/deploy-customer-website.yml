name: Deploy Customer Website to Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_website:
    name: Build & Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Customer Web Application
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SK_PIZZA_POINT }}
          channelId: live
          projectId: sk-pizza-point
        continue-on-error: true
