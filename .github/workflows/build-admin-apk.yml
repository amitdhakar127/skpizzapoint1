name: Build SK Pizza Point Admin Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_admin_apk:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Restore Firebase Android Config
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG"
          mkdir -p android-admin/app
          printf '%s' "$FIREBASE_ANDROID_CONFIG" > android-admin/app/google-services.json
          test -s android-admin/app/google-services.json
          echo "Firebase Android config restored."

      - name: Check Firebase Android Config
        run: |
          grep -q '"project_id": "sk-pizza-point"' android-admin/app/google-services.json
          grep -q '"package_name": "com.skpizzapoint.admin"' android-admin/app/google-services.json
          echo "Firebase Android config is correct."

      - name: Grant Gradle Execute Permission
        run: chmod +x android-admin/gradlew

      - name: Build Debug APK
        working-directory: android-admin
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android-admin/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-admin/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build successful."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sk-pizza-point-admin-debug-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
